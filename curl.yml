---
- name: Curl Download the cert
  hosts: all

  tasks:

    - name: folder
      ansible.builtin.file:
        path: /home/ec2-user/cert-folder/
        state: directory

    - name: curl 
      ansible.builtin.get_url:
        url: https://curl.se/ca/cacert.pem
        dest: /home/ec2-user/cert-folder/cacert.pem



